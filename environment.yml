# Full conda-env export of the project's working environment
# (/opt/miniconda3/envs/co2, Python 3.11.15, macOS arm64/M1), generated via
# `conda env export -n co2 --no-builds`. Unlike requirements.txt (which lists
# only the packages actually imported by name in this repo's .py files),
# this is every package installed in that env, direct and transitive --
# use this file when you want an exact, reproducible clone of the working
# environment rather than a minimal install.
#
# NOTE (found while generating this file): xgboost==3.2.0 and
# lightgbm==4.6.0 are installed in the co2 env but are not imported by any
# .py file in this repo as of this generation -- likely pulled in as
# side-effect installs or exploratory, not load-bearing. cdsapi is NOT
# installed in this env and is not imported anywhere in the repo either;
# RESEARCH_PAPER.md's own Limitations section (Sec 7) already flags ERA5
# wind-data access as "Not documented / needs verification" for exactly
# this reason -- if ERA5 is fetched via cdsapi somewhere, it is not in this
# environment and not in this codebase's tracked scripts.
#
# Create with: conda env create -f environment.yml
